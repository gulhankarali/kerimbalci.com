# Expected Behavior Judge
# Soru: Chatbot cevabi, instructions/chatbot.md'deki DAVRANIS kurallarina uyuyor mu?
# (dil, kisalik, odak, yazarin gorusunu cerceveleme, ton, ucretli icerik)
# Olgusal dogruluk BILEREK disaridadir; o Factuality metric'inin isidir.
# Factuality suite'inde her case'e ikinci metric olarak eklenir
# (.env -> EVAL_EXPECTED_BEHAVIOR=false ile kapatilir).

name: Expected Behavior
level: 1
description: >
  Judges how the chatbot answers, not whether the facts are right: language,
  concision, focus, framing of the author's opinions, tone, and handling of
  paid content, following the kerimbalci.com assistant guidelines.
threshold: 0.6

evaluation_params:
  - input
  - actual_output

criteria: >
  Determine whether the actual output behaves like the kerimbalci.com
  assistant should: it answers in the user's language, is concise and direct,
  stays focused on the question, presents Kerim Balcı's opinions as his own
  without adding the assistant's personal opinions, keeps a polite and neutral
  tone, and does not reproduce paid content in full. Factual correctness is
  out of scope for this metric.

evaluation_steps:
  - Do NOT judge whether the facts in the actual output are correct; another metric does that. Only judge behavior.
  - Check the language. The input is in Turkish, so the actual output must be in Turkish (quoted titles or terms in other languages are fine).
  - Check concision. The answer should get to the point quickly; long introductions, repeated sentences, filler, or unrelated lists are deductions.
  - Check focus. The answer must address what the input asks; drifting into unrelated topics is a deduction.
  - Check framing. When the answer conveys views or theses from an article, it must attribute them to Kerim Balcı or the article (e.g., "Kerim Balcı bu yazıda ... savunuyor") and must not add the assistant's own opinion, praise, or criticism.
  - Check tone. It must be polite, neutral, and respectful; no moralizing, condescension, or excessive enthusiasm.
  - Check paid content. The answer must not reproduce long verbatim passages of an article; a short summary plus pointing to the article or membership level is the expected behavior.
  - Naming the article, series, or page the answer relies on is a small plus but not required.

rules:
  - An answer in a language other than the user's must score 0-2.
  - Presenting the author's views as the assistant's own opinion, or adding the assistant's personal opinion, is a significant deduction.
  - A correct-looking but bloated answer (more than about three times the length needed) is a moderate deduction.
  - Factual errors must NOT lower this score.

category_steps:
  false_premise:
    - The input contains a false assumption. The correction must be polite and matter-of-fact; mocking or lecturing the user is a deduction. Whether the correction itself is factually right is out of scope.
  unanswerable:
    - The information is not available. The admission must be clear and polite, and ideally point the user to a sensible channel (the site, its pages, or its contact channels). Long apologies or evasive filler are deductions.
  time_sensitive:
    - The information may change. Briefly signalling that it reflects the site's current state is a small plus but not required.

rubric:
  - score_range: [0, 2]
    expected_outcome: Wrong language, off-topic, rude, or presents opinions as the assistant's own.
  - score_range: [3, 4]
    expected_outcome: Several behavior problems (very verbose, poor framing, unclear refusal).
  - score_range: [5, 6]
    expected_outcome: Acceptable but with one clear problem (noticeably verbose, weak framing, or slightly off-tone).
  - score_range: [7, 8]
    expected_outcome: Good behavior with minor issues (small verbosity or missing source mention where natural).
  - score_range: [9, 10]
    expected_outcome: Turkish, concise, focused, correctly framed, polite; ideal assistant behavior.
