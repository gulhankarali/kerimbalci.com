# Elle tetiklenen (ucretli) chatbot eval kosusu.
# GitHub -> Actions -> "Eval" -> "Run workflow" ile parametre secilerek calistirilir.
#
# Gerekli ayarlar (repo -> Settings -> Secrets and variables -> Actions):
#   Secrets  : HF_TOKEN, ANTHROPIC_API_KEY, CONFIDENT_API_KEY (opsiyonel)
#   Variables: HF_CHATBOT_URL, JUDGE_MODEL, CHATBOT_API_ENDPOINT (opsiyonel)
name: Eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite adi"
        type: choice
        options: [factuality]
        default: factuality
      level:
        description: "Hakem seviyesi (1 basic, 2 intermediate, 3 advanced)"
        type: choice
        options: ["1", "2", "3"]
        default: "3"
      tags:
        description: "Sadece bu tag'ler (virgulle; bos = hepsi)"
        type: string
        default: ""
      limit:
        description: "En fazla N case (bos = hepsi; maliyet icin once kucuk deneyin)"
        type: string
        default: "5"
      min_pass_rate:
        description: "Kalite kapisi esigi (0-1)"
        type: string
        default: "0.85"

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_CHATBOT_URL: ${{ vars.HF_CHATBOT_URL }}
      CHATBOT_API_ENDPOINT: ${{ vars.CHATBOT_API_ENDPOINT || '/cevapla' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
      # Workflow girdileri komut satirina dogrudan gomulmez (enjeksiyon riski);
      # ortam degiskeni olarak aktarilir.
      IN_SUITE: ${{ inputs.suite }}
      IN_LEVEL: ${{ inputs.level }}
      IN_TAGS: ${{ inputs.tags }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
    steps:
      - uses: actions/checkout@v4

      - name: uv kur
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Bagimliliklari kur
        run: uv sync --locked

      - name: Baglanti kontrolu (ucretsiz)
        run: uv run pytest -m "integration and not eval"

      - name: Eval kosusu
        run: |
          args=("$IN_SUITE" --level "$IN_LEVEL" --min-pass-rate "$IN_MIN_PASS_RATE")
          [ -n "$IN_TAGS" ] && args+=(--tags "$IN_TAGS")
          [ -n "$IN_LIMIT" ] && args+=(--limit "$IN_LIMIT")
          uv run python -m kerimbalci_com.evals "${args[@]}"

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.suite }}-L${{ inputs.level }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
