# Manually triggered (paid) chatbot eval run.
# Run it from GitHub -> Actions -> "Eval" -> "Run workflow" and pick the parameters.
#
# Required settings (repo -> Settings -> Secrets and variables -> Actions):
#   Secrets  : HF_TOKEN, ANTHROPIC_API_KEY, CONFIDENT_API_KEY (optional)
#   Variables: HF_CHATBOT_URL, JUDGE_MODEL, CHATBOT_API_ENDPOINT (optional)
name: Eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite name"
        type: choice
        options: [factuality, hallucination]
        default: factuality
      level:
        description: "Judge level (1 basic, 2 intermediate, 3 advanced)"
        type: choice
        options: ["1", "2", "3"]
        default: "3"
      tags:
        description: "Only these tags (comma-separated; empty = all)"
        type: string
        default: ""
      limit:
        description: "At most N cases (empty = all; try small first to limit cost)"
        type: string
        default: "5"
      min_pass_rate:
        description: "Quality gate threshold (0-1)"
        type: string
        default: "0.85"

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_CHATBOT_URL: ${{ vars.HF_CHATBOT_URL }}
      CHATBOT_API_ENDPOINT: ${{ vars.CHATBOT_API_ENDPOINT || '/cevapla' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
      # Workflow inputs are not embedded in the command line (injection risk);
      # they are passed as environment variables.
      IN_SUITE: ${{ inputs.suite }}
      IN_LEVEL: ${{ inputs.level }}
      IN_TAGS: ${{ inputs.tags }}
      IN_LIMIT: ${{ inputs.limit }}
      IN_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Connection check (free)
        run: uv run pytest -m "integration and not eval"

      - name: Eval run
        run: |
          args=("$IN_SUITE" --level "$IN_LEVEL" --min-pass-rate "$IN_MIN_PASS_RATE")
          [ -n "$IN_TAGS" ] && args+=(--tags "$IN_TAGS")
          [ -n "$IN_LIMIT" ] && args+=(--limit "$IN_LIMIT")
          uv run python -m kerimbalci_com.evals "${args[@]}"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ inputs.suite }}-L${{ inputs.level }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
