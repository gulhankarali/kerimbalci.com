[project]
name = "kerimbalci-com"
version = "0.1.0"
description = "kerimbalci.com chatbot'u icin LLM eval otomasyon framework'u (deepeval + Confident AI)"
readme = "README.md"
authors = [
    { name = "Gulhan Karali Balci", email = "gulhan.karali@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7.0",
    "deepeval>=4.3.3",
    "gradio-client>=2.7.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
kerimbalci-com = "kerimbalci_com:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: gercek ag baglantisi gerektiren testler (uv run pytest -m integration)",
    "eval: hakem modelle ucretli LLM degerlendirmesi (uv run deepeval test run tests/factuality/)",
]
log_cli = true
log_cli_level = "INFO"
