[project]
name = "kerimbalci-com"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gulhan Karali Balci", email = "gulhan.karali@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
kerimbalci-com = "kerimbalci_com:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
log_cli = true
log_cli_level = "INFO"
